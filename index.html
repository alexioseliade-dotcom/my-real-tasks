<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="My Tasks"/>
<meta name="theme-color" content="#ffffff"/>
<title>My Tasks</title>
<link rel="manifest" href="manifest.json"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f0; --surface: #ffffff; --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --muted: #888; --radius: 12px;
    --high-bg: #FAECE7; --high-text: #993C1D; --high-bar: #D85A30;
    --med-bg: #FAEEDA; --med-text: #854F0B; --med-bar: #BA7517;
    --low-bg: #EAF3DE; --low-text: #3B6D11; --low-bar: #639922;
    --done: #639922;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a; --surface: #252525; --border: rgba(255,255,255,0.1);
      --text: #f0f0f0; --muted: #888;
      --high-bg: #4A1B0C; --high-text: #F0997B;
      --med-bg: #412402; --med-text: #FAC775;
      --low-bg: #173404; --low-text: #C0DD97;
    }
  }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
  header { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 16px 20px 0; position: sticky; top: 0; z-index: 10; padding-top: calc(16px + env(safe-area-inset-top)); }
  header h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
  .tabs { display: flex; gap: 0; }
  .tab { flex: 1; padding: 10px; font-size: 14px; background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }
  main { padding: 16px 16px 100px; max-width: 600px; margin: 0 auto; }

  /* Add bar */
  .add-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-bar input { flex: 1; padding: 10px 14px; font-size: 15px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; outline: none; -webkit-appearance: none; }
  .add-bar select { padding: 10px 8px; font-size: 13px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; cursor: pointer; -webkit-appearance: none; }
  .add-bar button { padding: 10px 16px; font-size: 14px; font-weight: 500; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--text); color: var(--bg); cursor: pointer; font-family: inherit; white-space: nowrap; }

  /* Filters */
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 5px 13px; font-size: 13px; border-radius: 99px; cursor: pointer; border: 0.5px solid var(--border); background: var(--surface); color: var(--muted); font-family: inherit; transition: all 0.15s; }
  .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }

  /* Tasks */
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface); margin-bottom: 8px; transition: opacity 0.2s; }
  .task.done { opacity: 0.55; }
  .check { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border); background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
  .check.checked { background: var(--done); border-color: var(--done); }
  .task-text { flex: 1; font-size: 15px; line-height: 1.4; word-break: break-word; }
  .task.done .task-text { text-decoration: line-through; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 500; flex-shrink: 0; align-self: flex-start; }
  .badge.High { background: var(--high-bg); color: var(--high-text); }
  .badge.Medium { background: var(--med-bg); color: var(--med-text); }
  .badge.Low { background: var(--low-bg); color: var(--low-text); }
  .del { font-size: 16px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0 2px; line-height: 1; -webkit-tap-highlight-color: transparent; }
  .empty { text-align: center; padding: 3rem 0; font-size: 15px; color: var(--muted); }

  /* Stats */
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 10px; text-align: center; }
  .stat-num { font-size: 28px; font-weight: 600; display: block; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }
  .section-title { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
  .progress-wrap { margin-bottom: 20px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
  .progress-bar { height: 10px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: var(--done); transition: width 0.4s; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar-label { font-size: 13px; color: var(--muted); width: 54px; flex-shrink: 0; }
  .bar-track { flex: 1; height: 10px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
  .bar-count { font-size: 12px; color: var(--muted); width: 52px; text-align: right; flex-shrink: 0; }
  .insight { margin-top: 16px; padding: 14px 16px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface); font-size: 14px; color: var(--muted); line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>My Tasks</h1>
  <div class="tabs">
    <button class="tab active" onclick="showTab('tasks',this)">Tasks</button>
    <button class="tab" onclick="showTab('stats',this)">Progress</button>
  </div>
</header>
<main>
  <!-- TASKS TAB -->
  <div id="tab-tasks">
    <div class="add-bar">
      <input id="taskInput" type="text" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()"/>
      <select id="priSel">
        <option>High</option><option selected>Medium</option><option>Low</option>
      </select>
      <button onclick="addTask()">Add</button>
    </div>
    <div class="filters" id="filters"></div>
    <div id="taskList"></div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" style="display:none">
    <div class="stat-grid" id="statGrid"></div>
    <div class="progress-wrap">
      <div class="progress-header">
        <span style="font-weight:500">Overall completion</span>
        <span id="pctLabel" style="font-weight:500"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="mainBar"></div></div>
    </div>
    <p class="section-title">By priority</p>
    <div id="byPriority"></div>
    <div class="insight" id="insight"></div>
  </div>
</main>

<script>
const PRIORITIES = ['High','Medium','Low'];
const BAR_COLORS = { High:'#D85A30', Medium:'#BA7517', Low:'#639922' };
let tasks = JSON.parse(localStorage.getItem('tasks')||'[]');
let filter = 'All';

function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }
function uid() { return Math.random().toString(36).slice(2,9); }

function addTask() {
  const inp = document.getElementById('taskInput');
  const t = inp.value.trim();
  if (!t) return;
  tasks.unshift({ id: uid(), text: t, priority: document.getElementById('priSel').value, done: false });
  inp.value = '';
  save(); render();
}

function toggleTask(id) {
  const t = tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; save(); render(); }
}

function deleteTask(id) {
  tasks = tasks.filter(x => x.id !== id);
  save(); render();
}

function setFilter(f) { filter = f; render(); }

function showTab(name, btn) {
  document.getElementById('tab-tasks').style.display = name==='tasks'?'':'none';
  document.getElementById('tab-stats').style.display = name==='stats'?'':'none';
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (name==='stats') renderStats();
}

function render() {
  // Filters
  const fEl = document.getElementById('filters');
  const fOpts = ['All','Active','Done',...PRIORITIES];
  fEl.innerHTML = fOpts.map(f =>
    `<button class="chip${filter===f?' active':''}" onclick="setFilter('${f}')">${f}</button>`
  ).join('');

  // Tasks
  let filtered = tasks;
  if (filter==='Active') filtered = tasks.filter(t=>!t.done);
  else if (filter==='Done') filtered = tasks.filter(t=>t.done);
  else if (PRIORITIES.includes(filter)) filtered = tasks.filter(t=>t.priority===filter);

  const list = document.getElementById('taskList');
  if (!filtered.length) { list.innerHTML = '<div class="empty">No tasks here yet.</div>'; return; }
  list.innerHTML = filtered.map(t => `
    <div class="task${t.done?' done':''}">
      <div class="check${t.done?' checked':''}" onclick="toggleTask('${t.id}')">
        ${t.done?`<svg width="13" height="10" viewBox="0 0 13 10"><path d="M1 5L5 9L12 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`:''}
      </div>
      <span class="task-text">${escHtml(t.text)}</span>
      <span class="badge ${t.priority}">${t.priority}</span>
      <button class="del" onclick="deleteTask('${t.id}')">✕</button>
    </div>
  `).join('');
}

function renderStats() {
  const total = tasks.length, done = tasks.filter(t=>t.done).length, active = total-done;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('statGrid').innerHTML = [
    [total,'Total tasks'],[done,'Completed'],[active,'Remaining']
  ].map(([n,l])=>`<div class="stat-card"><span class="stat-num">${n}</span><span class="stat-label">${l}</span></div>`).join('');
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('mainBar').style.width = pct+'%';
  document.getElementById('byPriority').innerHTML = PRIORITIES.map(p => {
    const pt = tasks.filter(t=>t.priority===p).length;
    const pd = tasks.filter(t=>t.priority===p&&t.done).length;
    const pp = pt ? Math.round(pd/pt*100) : 0;
    return `<div class="bar-row">
      <span class="bar-label">${p}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pp}%;background:${BAR_COLORS[p]}"></div></div>
      <span class="bar-count">${pd}/${pt} done</span>
    </div>`;
  }).join('');
  document.getElementById('insight').textContent = pct===100
    ? 'All tasks complete — great work!'
    : pct>=50 ? `You're more than halfway there. Keep it up!`
    : `${active} task${active!==1?'s':''} left to tackle. You've got this!`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

render();
</script>

<!-- Service Worker registration -->
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
